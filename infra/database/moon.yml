project:
  name: repo/database
  description: database for the no-stress client apps

language: go

dependsOn:
  - repo

tasks:
  # Generate Go code from SQL using sqlc
  generate:
    type: build
    command: 'go tool sqlc generate'
    toolchains:
      - go
    inputs:
      - 'sequel/schema.sql'
      - 'sequel/queries.sql'
      - 'sqlc.yaml'
    outputs:
      - 'schema/'

  # Create a new versioned migration by diffing schema.sql against migrations/
  migrate-diff:
    type: build
    command: 'atlas migrate diff --to "file://sequel/schema.sql" --dev-url "docker://postgres/16/dev"'
    inputs:
      - 'sequel/schema.sql'
    toolchain:
      - system
    outputs:
      - 'migrations/'

  # Apply migrations to a database (defaults to localhost)
  migrate-apply:
    type: run
    command: 'atlas migrate apply --url "postgres://postgres:password@localhost:5432/nostress?sslmode=disable" --dir "file://migrations"'

  # Check SQL queries for correctness
  check:
    type: run
    command: 'sqlc compile'
    toolchains:
      - system
    inputs:
      - 'sequel/schema.sql'
      - 'sequel/queries.sql'

  # Aggregate build task
  build:
    type: build
    deps:
      - ~:generate
      - ~:check
    options:
      runInCI: false
